<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUVAT Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>SUVAT Calculator</h1>

<div class="container">

    <input type="number" id="s" placeholder="s (m)">
    <input type="number" id="u" placeholder="u (m/s)">
    <input type="number" id="v" placeholder="v (m/s)">
    <input type="number" id="a" placeholder="a (m/s²)">
    <input type="number" id="t" placeholder="t (s)">

    <button onclick="calculate()">
        คำนวณ
    </button>

    <h2 id="result">ผลลัพธ์</h2>

</div>

<script src="script.js"></script>

</body>
</html>
